<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>토요일의 테니스</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 18px 60px;
      background: #f5f3ee;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Pretendard",
        "Apple SD Gothic Neo",
        sans-serif;
      color: #222;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    h1 {
      font-size: 34px;
      margin: 0 0 6px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 26px;
    }

    .refresh-button {
      border: none;
      background: #222;
      color: white;
      padding: 12px 18px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    #status {
      color: #999;
      font-size: 13px;
      margin-bottom: 18px;
    }

    .latest-card {
      background: white;
      border-radius: 26px;
      padding: 28px;
      box-shadow: 0 10px 36px rgba(0,0,0,0.07);
      margin-bottom: 36px;
    }

    .latest-label {
      font-size: 12px;
      color: #aaa;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }

    .round {
      display: inline-block;
      font-size: 14px;
      font-weight: 700;
      background: #f1efe9;
      padding: 7px 11px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .date {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 24px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin: 12px 0;
    }

    .label {
      color: #777;
    }

    .value {
      font-weight: 700;
      text-align: right;
    }

    .divider {
      border-top: 1px solid #eee;
      margin: 20px 0;
    }

    .total-row .label,
    .total-row .value {
      font-weight: 800;
      color: #222;
    }

    .reserve {
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }

    .reserve .value {
      font-size: 22px;
    }

    .participants-button {
      margin-top: 22px;
      border: 1px solid #ddd;
      background: white;
      color: #333;
      padding: 10px 15px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
    }

    .participants {
      display: none;
      margin-top: 14px;
      padding: 16px;
      background: #f8f7f3;
      border-radius: 14px;
      line-height: 1.7;
      color: #555;
      font-size: 14px;
    }

    .participants.show {
      display: block;
    }

    .participants-title {
      font-weight: 700;
      color: #333;
      margin-bottom: 6px;
    }

    h2 {
      font-size: 20px;
      margin: 0 0 16px;
    }

    details {
      background: white;
      border-radius: 18px;
      margin-bottom: 12px;
      overflow: hidden;
      box-shadow: 0 6px 22px rgba(0,0,0,0.04);
    }

    summary {
      cursor: pointer;
      padding: 18px 20px;
      font-weight: 700;
      list-style: none;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    .history-content {
      padding: 0 20px 22px;
    }

    .history-round {
      color: #999;
      font-size: 13px;
      margin-bottom: 4px;
    }
#loading {
  text-align: center;
  padding: 50px 20px 60px;
  color: #888;
}

.spinner {
  width: 32px;
  height: 32px;
  margin: 0 auto 16px;

  border: 3px solid #ddd;
  border-top-color: #222;
  border-radius: 50%;

  animation: spin 0.8s linear infinite;
}

.loading-text {
  font-size: 14px;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
  </style>
</head>

<body>

  <div class="container">

    <h1>🎾 토요일의 테니스</h1>
    <div class="subtitle">주간 모임 회계 현황</div>

    <button class="refresh-button" onclick="loadData()">
      ↻ 최신 내역 불러오기
    </button>

<div id="status">
  데이터를 불러오는 중...
</div>

<div id="loading">
  <div class="spinner"></div>
  <div class="loading-text">
    테니스 기록을 불러오고 있어요
  </div>
</div>

<div id="latest"></div>

    <h2>지난 모임</h2>
    <div id="history"></div>

  </div>


<script>

  const API_URL =
    "https://script.google.com/macros/s/AKfycbyVgFXjTJtcD0GhC_ZjHzNLlGRFXDaadaHY2nWNmqJzewJL1eY9lbtGQI2AdxWU0HAh/exec";

  const CACHE_KEY = "saturday-tennis-data";
  const CACHE_TIME_KEY = "saturday-tennis-time";


  // -----------------------------------------
  // 1. 페이지가 열리면 가장 먼저 실행
  // -----------------------------------------

  start();


  function start() {

    const cachedData =
      localStorage.getItem(CACHE_KEY);

    const cachedTime =
      localStorage.getItem(CACHE_TIME_KEY);


    // 저장된 데이터가 있다면 즉시 보여준다
    if (cachedData) {

      try {

        const data = JSON.parse(cachedData);

        renderData(data);

        document.getElementById("status").textContent =
          "저장된 내역 표시 중 · 마지막 업데이트 " +
          formatUpdateTime(cachedTime);

      }

      catch (error) {

        console.error("캐시 읽기 오류:", error);

      }

    }


    // 저장된 데이터 유무와 관계없이
    // 뒤에서 최신 데이터를 다시 가져온다
    loadData(false);

  }



  // -----------------------------------------
  // 2. Google Apps Script에서 최신 데이터 가져오기
  // -----------------------------------------

  async function loadData(showLoading = true) {

    const status =
      document.getElementById("status");


    // 사용자가 직접 새로고침 버튼을 눌렀을 때만
    // 로딩 문구를 보여준다
    if (showLoading) {

      status.textContent =
        "최신 데이터를 불러오는 중...";

    }


    try {

      const response =
        await fetch(API_URL);

      if (!response.ok) {
        throw new Error(
          "서버 응답 오류: " + response.status
        );
      }

      const data =
        await response.json();


      if (!data.length) {

        status.textContent =
          "등록된 모임이 없습니다.";

        return;

      }


      // 최신 데이터 화면에 표시
      renderData(data);


      // 현재 시간을 기록
      const now =
        new Date().toISOString();


      // 최신 데이터를 브라우저에 저장
      localStorage.setItem(
        CACHE_KEY,
        JSON.stringify(data)
      );

      localStorage.setItem(
        CACHE_TIME_KEY,
        now
      );


      status.textContent =
        "최신 내역 · " +
        formatUpdateTime(now);

    }

    catch (error) {

      console.error(error);


      // 이미 캐시가 화면에 표시되어 있다면
      // 오류가 나더라도 기존 화면은 유지
      const cachedData =
        localStorage.getItem(CACHE_KEY);

      if (cachedData) {

        const cachedTime =
          localStorage.getItem(CACHE_TIME_KEY);

        status.textContent =
          "저장된 내역 표시 중 · 마지막 업데이트 " +
          formatUpdateTime(cachedTime);

      }

      else {

        status.textContent =
          "데이터를 불러오지 못했습니다.";

      }

    }

  }



  // -----------------------------------------
  // 3. 받은 데이터를 실제 화면에 그리기
  // -----------------------------------------

  function renderData(data) {

  document.getElementById("loading").style.display = "none";

  const latest =
    document.getElementById("latest");

  const history =
    document.getElementById("history");


    latest.innerHTML = "";
    history.innerHTML = "";


    const sorted =
      data
        .slice()
        .sort(
          (a, b) =>
            new Date(b["모임일"]) -
            new Date(a["모임일"])
        );


    const newest =
      sorted[0];

    const past =
      sorted.slice(1);


    // 최신 모임
    latest.innerHTML = `
      <div class="latest-card">

        <div class="latest-label">
          LATEST MEETING
        </div>

        <div class="round">
          ${roundText(newest)}
        </div>

        <div class="date">
          ${formatDate(newest["모임일"])}
        </div>

        ${meetingRows(newest)}

        ${participantSection(newest, "latest")}

        <div class="row reserve">
          <span class="label">
            현재 예비비
          </span>

          <span class="value">
            ${money(newest["예비비 누계"])}
          </span>
        </div>

      </div>
    `;


    // 지난 모임
    past.forEach((meeting, index) => {

      const item =
        document.createElement("details");


      item.innerHTML = `
        <summary>

          <div class="history-round">
            ${roundText(meeting)}
          </div>

          ${formatDate(meeting["모임일"])}

        </summary>


        <div class="history-content">

          ${meetingRows(meeting)}

          ${participantSection(
            meeting,
            "past" + index
          )}

          <div class="row reserve">

            <span class="label">
              예비비 누계
            </span>

            <span class="value">
              ${money(
                meeting["예비비 누계"]
              )}
            </span>

          </div>

        </div>
      `;


      history.appendChild(item);

    });

  }



  // -----------------------------------------
  // 4. 모임의 회계 정보
  // -----------------------------------------

  function meetingRows(meeting) {

    return `
      <div class="row">
        <span class="label">
          참석인원
        </span>

        <span class="value">
          ${meeting["참석인원"]}명
        </span>
      </div>


      <div class="row">
        <span class="label">
          코트수
        </span>

        <span class="value">
          ${meeting["코트수"]}면
        </span>
      </div>


      <div class="divider"></div>


      <div class="row">
        <span class="label">
          코트비
        </span>

        <span class="value">
          ${money(meeting["코트비"])}
        </span>
      </div>


      <div class="row">
        <span class="label">
          공비
        </span>

        <span class="value">
          ${money(meeting["공비"])}
        </span>
      </div>


      ${
        Number(meeting["기타비용"]) !== 0
          ? `
            <div class="row">

              <span class="label">
                기타비용
                ${
                  meeting["기타내용"]
                    ? " · " +
                      meeting["기타내용"]
                    : ""
                }
              </span>

              <span class="value">
                ${money(
                  meeting["기타비용"]
                )}
              </span>

            </div>
          `
          : ""
      }


      <div class="divider"></div>


      <div class="row total-row">

        <span class="label">
          총 정산액
        </span>

        <span class="value">
          ${money(
            meeting["정산목표액"]
          )}
        </span>

      </div>


 ${(() => {

  const participants =
    Array.isArray(meeting["참가자"])
      ? meeting["참가자"]
      : [];

  const amounts =
    participants.map(
      person => Number(person["입금액"])
    );

  const allSame =
    amounts.length > 0 &&
    amounts.every(
      amount => amount === amounts[0]
    );

  if (allSame) {

    return `
      <div class="row">
        <span class="label">
          1인당 금액
        </span>

        <span class="value">
          ${money(amounts[0])}
        </span>
      </div>
    `;

  }

  return `
    <div class="row">
      <span class="label">
        정산 금액
      </span>

      <span class="value">
        참가자별 상이
      </span>
    </div>
  `;

})()}


      <div class="row">

        <span class="label">
          이번 회차 예비비
        </span>

        <span class="value">
          ${signedMoney(
            meeting["실제 예비비 증감"]
          )}
        </span>

      </div>
    `;

  }



  // -----------------------------------------
  // 5. 참가자 보기
  // -----------------------------------------

 function participantSection(meeting, id) {

  const participants =
    Array.isArray(meeting["참가자"])
      ? meeting["참가자"]
      : [];

  if (participants.length === 0) {
    return "";
  }

  // 참가자들의 입금액만 모음
  const amounts =
    participants.map(
      person => Number(person["입금액"])
    );

  // 모두 같은 금액인지 확인
  const allSame =
    amounts.every(
      amount => amount === amounts[0]
    );

  let participantContent = "";

  if (allSame) {

    // 모두 같은 금액이면 이름만 간단하게 표시
    participantContent = `
      <div class="participants-title">
        참가자
      </div>

      ${participants
        .map(person => person["이름"])
        .join(" · ")}
    `;

  } else {

    // 금액이 다르면 이름 + 실제 입금액 표시
    participantContent = `
      <div class="participants-title">
        참가자별 정산
      </div>

      ${participants
        .map(person => `
          <div class="row">
            <span class="label">
              ${person["이름"]}
            </span>

            <span class="value">
              ${money(person["입금액"])}
            </span>
          </div>
        `)
        .join("")}

      ${
        meeting["비고"]
          ? `
            <div
              style="
                margin-top: 14px;
                padding-top: 12px;
                border-top: 1px solid #e8e6e0;
                color: #777;
                font-size: 13px;
                line-height: 1.6;
              "
            >
              ※ ${meeting["비고"]}
            </div>
          `
          : ""
      }
    `;

  }

  return `
    <button
      class="participants-button"
      onclick="toggleParticipants('${id}', this)"
    >
      참가자 보기
    </button>

    <div
      class="participants"
      id="participants-${id}"
    >
      ${participantContent}
    </div>
  `;
}


  function toggleParticipants(id, button) {

    const box =
      document.getElementById(
        "participants-" + id
      );


    const isOpen =
      box.classList.contains("show");


    if (isOpen) {

      box.classList.remove("show");

      button.textContent =
        "참가자 보기";

    }

    else {

      box.classList.add("show");

      button.textContent =
        "참가자 닫기";

    }

  }



  // -----------------------------------------
  // 6. 회차
  // -----------------------------------------

  function roundText(meeting) {

    const round =
      meeting["회차"];


    if (
      round === "" ||
      round === null ||
      round === undefined
    ) {

      return "회차 미기록";

    }


    return `${round}회차`;

  }



  // -----------------------------------------
  // 7. 모임 날짜
  // -----------------------------------------

  function formatDate(value) {

    const date =
      new Date(value);


    return new Intl.DateTimeFormat(
      "ko-KR",
      {
        timeZone: "Asia/Seoul",
        year: "numeric",
        month: "long",
        day: "numeric",
        weekday: "short"
      }
    ).format(date);

  }



  // -----------------------------------------
  // 8. 마지막 업데이트 시간
  // -----------------------------------------

  function formatUpdateTime(value) {

    if (!value) {
      return "확인 불가";
    }


    const date =
      new Date(value);


    return new Intl.DateTimeFormat(
      "ko-KR",
      {
        timeZone: "Asia/Seoul",
        month: "numeric",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      }
    ).format(date);

  }



  // -----------------------------------------
  // 9. 금액 표시
  // -----------------------------------------

  function money(value) {

    if (
      value === "" ||
      value === null ||
      value === undefined
    ) {

      return "-";

    }


    return Math.round(
      Number(value)
    ).toLocaleString("ko-KR") + "원";

  }



  function signedMoney(value) {

    if (
      value === "" ||
      value === null ||
      value === undefined
    ) {

      return "-";

    }


    const number =
      Math.round(
        Number(value)
      );


    if (number > 0) {

      return "+" +
        number.toLocaleString("ko-KR") +
        "원";

    }


    return number
      .toLocaleString("ko-KR") +
      "원";

  }

</script>

</body>
</html>
