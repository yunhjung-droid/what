<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>토요일의 테니스</title>

  <style>
    body {
      margin: 0;
      padding: 32px 18px;
      background: #f5f3ee;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif;
      color: #222;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    h1 {
      font-size: 34px;
      margin: 0 0 6px;
    }

    .subtitle {
      color: #777;
      margin-bottom: 28px;
    }

    .refresh-button {
      border: none;
      background: #222;
      color: white;
      padding: 12px 18px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 24px;
    }

    #status {
      color: #888;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .latest-card {
      background: white;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 10px 36px rgba(0,0,0,0.07);
      margin-bottom: 32px;
    }

    .latest-label {
      font-size: 13px;
      color: #999;
      margin-bottom: 8px;
      letter-spacing: 0.05em;
    }

    .date {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 24px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin: 12px 0;
    }

    .label {
      color: #777;
    }

    .value {
      font-weight: 700;
      text-align: right;
    }

    .reserve {
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }

    .reserve .value {
      font-size: 22px;
    }

    h2 {
      font-size: 20px;
      margin: 0 0 16px;
    }

    details {
      background: white;
      border-radius: 18px;
      margin-bottom: 12px;
      overflow: hidden;
      box-shadow: 0 6px 22px rgba(0,0,0,0.04);
    }

    summary {
      cursor: pointer;
      padding: 18px 20px;
      font-weight: 700;
      list-style: none;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    .history-content {
      padding: 0 20px 20px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎾 토요일의 테니스</h1>
    <div class="subtitle">주간 모임 회계 현황</div>

    <button class="refresh-button" onclick="loadData()">
      ↻ 최신 내역 불러오기
    </button>

    <div id="status">데이터를 불러오는 중...</div>

    <div id="latest"></div>

    <h2>지난 모임</h2>
    <div id="history"></div>

  </div>


<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbzX6NT6Amo2MZ_NrquIWmUfR8DwhrjQEsOP-LPUb3hRkiphcQnRYwgU7rpMtiIBpDiA/exec";

  async function loadData() {

    const status = document.getElementById("status");
    const latest = document.getElementById("latest");
    const history = document.getElementById("history");

    status.textContent = "최신 데이터를 불러오는 중...";
    latest.innerHTML = "";
    history.innerHTML = "";

    try {

      const response = await fetch(API_URL);
      const data = await response.json();

      if (!data.length) {
        status.textContent = "등록된 모임이 없습니다.";
        return;
      }

      const sorted = data
        .slice()
        .sort((a, b) => new Date(b["모임일"]) - new Date(a["모임일"]));

      const newest = sorted[0];
      const past = sorted.slice(1);

      status.textContent = `총 ${data.length}회의 모임 기록`;

      latest.innerHTML = `
        <div class="latest-card">

          <div class="latest-label">
            LATEST MEETING
          </div>

          <div class="date">
            ${formatDate(newest["모임일"])}
          </div>

          ${meetingRows(newest)}

          <div class="row reserve">
            <span class="label">현재 예비비</span>
            <span class="value">
              ${money(newest["예비비 누계"])}
            </span>
          </div>

        </div>
      `;

      past.forEach(meeting => {

        const item = document.createElement("details");

        item.innerHTML = `
          <summary>
            ${formatDate(meeting["모임일"])}
          </summary>

          <div class="history-content">
            ${meetingRows(meeting)}

            <div class="row reserve">
              <span class="label">예비비 누계</span>
              <span class="value">
                ${money(meeting["예비비 누계"])}
              </span>
            </div>
          </div>
        `;

        history.appendChild(item);

      });

    } catch (error) {

      console.error(error);
      status.textContent = "데이터를 불러오지 못했습니다.";

    }
  }


  function meetingRows(meeting) {

    return `
      <div class="row">
        <span class="label">참석인원</span>
        <span class="value">${meeting["참석인원"]}명</span>
      </div>

      <div class="row">
        <span class="label">코트수</span>
        <span class="value">${meeting["코트수"]}면</span>
      </div>

      <div class="row">
        <span class="label">코트비</span>
        <span class="value">${money(meeting["코트비"])}</span>
      </div>

      <div class="row">
        <span class="label">공비</span>
        <span class="value">${money(meeting["공비"])}</span>
      </div>

      <div class="row">
        <span class="label">1인당 금액</span>
        <span class="value">${money(meeting["이론상 1인당"])}</span>
      </div>

      <div class="row">
        <span class="label">실제 입금액</span>
        <span class="value">${money(meeting["실제 입금액"])}</span>
      </div>

      <div class="row">
        <span class="label">이번 주 예비비 증감</span>
        <span class="value">${signedMoney(meeting["실제 예비비 증감"])}</span>
      </div>
    `;
  }


  function formatDate(value) {

    const date = new Date(value);

    return new Intl.DateTimeFormat(
      "ko-KR",
      {
        timeZone: "Asia/Seoul",
        year: "numeric",
        month: "long",
        day: "numeric",
        weekday: "short"
      }
    ).format(date);

  }


  function money(value) {

    if (
      value === "" ||
      value === null ||
      value === undefined
    ) {
      return "-";
    }

    return Math.round(Number(value))
      .toLocaleString("ko-KR") + "원";
  }


  function signedMoney(value) {

    if (
      value === "" ||
      value === null ||
      value === undefined
    ) {
      return "-";
    }

    const number = Math.round(Number(value));

    if (number > 0) {
      return "+" + number.toLocaleString("ko-KR") + "원";
    }

    return number.toLocaleString("ko-KR") + "원";
  }


  loadData();

</script>

</body>
</html>
