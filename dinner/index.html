<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>19일 저녁 메뉴 뽑기</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #f4f0e8;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Pretendard",
        "Apple SD Gothic Neo",
        sans-serif;

      color: #222;
    }

    .container {
      width: min(90%, 600px);
      text-align: center;
      padding: 40px 20px;
    }

    .date {
      font-size: 15px;
      color: #888;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 38px;
      line-height: 1.3;
    }

    .subtitle {
      margin-top: 14px;
      color: #777;
      font-size: 17px;
    }

    #restaurant {
      min-height: 140px;

      display: flex;
      justify-content: center;
      align-items: center;

      margin: 50px 0 40px;

      font-size: 42px;
      font-weight: 800;
      line-height: 1.3;

      word-break: keep-all;
    }

    button {
      border: none;

      background: #222;
      color: white;

      font-size: 19px;
      font-weight: 600;

      padding: 18px 34px;

      border-radius: 999px;

      cursor: pointer;

      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      background: #444;
    }

    button:active {
      transform: scale(0.96);
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .result {
      animation: pop 0.6s ease;
    }

    @keyframes pop {

      0% {
        opacity: 0;
        transform: scale(0.7);
      }

      65% {
        opacity: 1;
        transform: scale(1.14);
      }

      100% {
        transform: scale(1);
      }

    }

    .footer {
      margin-top: 40px;
      font-size: 13px;
      color: #aaa;
    }

  </style>
</head>


<body>

  <div class="container">

    <div class="date">
      AUGUST 19
    </div>

    <h1>
      19일 저녁 메뉴를<br>
      골라보세요!
    </h1>

    <div class="subtitle">
      운명에 맡겨봅시다.
    </div>


    <div id="restaurant">
      🍽️
    </div>


    <button id="pickButton" onclick="pickRestaurant()">

      저녁 뽑기

    </button>


    <div class="footer">

      결과에 대한 책임은 룰렛에게 있습니다.

    </div>

  </div>



<script>

const restaurants = [

  "야키토리잔잔 광교점",

  "뭉텅 광교점",

  "정희 광교아브뉴프랑점",

  "갠지스 광교점",

  "루베르데 광교",

  "두강곱창 광교본점",

  "라고",

  "거궁 광교점",

  "규엔당 아브뉴프랑 광교점",

  "윤세영식당 광교직영점"

];


let rolling = false;


function pickRestaurant() {

  if (rolling) return;

  rolling = true;


  const restaurant =
    document.getElementById("restaurant");

  const button =
    document.getElementById("pickButton");


  restaurant.classList.remove("result");

  button.disabled = true;

  button.textContent = "운명이 결정되는 중...";


  let speed = 55;

  let count = 0;


  function roulette() {

    const randomIndex =
      Math.floor(
        Math.random() * restaurants.length
      );


    restaurant.textContent =
      restaurants[randomIndex];


    count++;


    if (count < 15) {

      speed = 55;

    }

    else {

      speed = speed * 1.18;

    }


    if (speed < 500) {

      setTimeout(
        roulette,
        speed
      );

    }


    else {

      const finalIndex =
        Math.floor(
          Math.random() * restaurants.length
        );


      restaurant.textContent =
        restaurants[finalIndex];


      void restaurant.offsetWidth;

      restaurant.classList.add("result");


      button.disabled = false;

      button.textContent = "다시 뽑기";


      rolling = false;

    }

  }


  roulette();

}

</script>

</body>
</html>
