<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>서영 선생님 그런데</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f1e8;
      font-family: Arial, "Pretendard", sans-serif;
      color: #222;
    }

    .container {
      width: min(90%, 600px);
      text-align: center;
      padding: 40px 24px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 50px;
      line-height: 1.3;
    }

    #message {
      min-height: 110px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 38px;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 40px;
    }

    button {
      border: none;
      background: #222;
      color: white;
      font-size: 20px;
      padding: 18px 34px;
      border-radius: 50px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      background: #444;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
      transform: none;
    }

    .shake {
      animation: shake 0.15s infinite;
    }

    .reveal {
      animation: reveal 0.7s ease;
    }

    @keyframes shake {
      0%   { transform: translateX(-3px); }
      50%  { transform: translateX(3px); }
      100% { transform: translateX(-3px); }
    }

    @keyframes reveal {
      0% {
        opacity: 0;
        transform: scale(0.6);
      }

      60% {
        opacity: 1;
        transform: scale(1.15);
      }

      100% {
        transform: scale(1);
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>서영 선생님 그런데</h1>

    <div id="message">🤔</div>

    <button id="button" onclick="revealMessage()">
      눌러보세요
    </button>

  </div>

  <script>
    function revealMessage() {

      const message = document.getElementById("message");
      const button = document.getElementById("button");

      button.disabled = true;
      button.textContent = "잠시만요...";

      message.classList.add("shake");

      setTimeout(() => {
        message.textContent = "두구...";
      }, 300);

      setTimeout(() => {
        message.textContent = "두구... 두구...";
      }, 900);

      setTimeout(() => {
        message.textContent = "두구두구두구두구...";
      }, 1600);

      setTimeout(() => {
        message.textContent = "🥁 두구두구두구두구두구...";
      }, 2300);

      setTimeout(() => {

        message.classList.remove("shake");

        message.textContent = "집들이는 언제 하실 거예요!? 🏠🎉";

        message.classList.add("reveal");

        button.textContent = "ㅋㅋㅋㅋ";
        button.disabled = false;

      }, 3200);
    }
  </script>

</body>
</html>
